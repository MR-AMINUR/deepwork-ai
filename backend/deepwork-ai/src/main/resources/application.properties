# Application Configuration
# Profile will be set via environment variable: SPRING_PROFILES_ACTIVE
spring.application.name=deepwork-ai
server.port=${PORT:8081}

# ---- DATABASE ----
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:deepwork_ai_dev}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- FILE UPLOAD ----
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- TIMEOUTS ----
server.tomcat.connection-timeout=600000
spring.mvc.async.request-timeout=600000

# ---- CORS ----
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ---- AI SERVICE ----
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/analyze}