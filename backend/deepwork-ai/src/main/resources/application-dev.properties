# Development Environment Configuration
spring.application.name=deepwork-ai
server.port=8081

# ---- DATABASE (H2 for local development) ----
spring.datasource.url=jdbc:h2:mem:deepwork_ai_dev
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- H2 Console (accessible at http://localhost:8081/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- FILE UPLOAD ----
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- TIMEOUTS ----
server.tomcat.connection-timeout=600000
spring.mvc.async.request-timeout=600000

# ---- CORS ----
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- AI SERVICE ----
ai.service.url=http://localhost:8000/analyze

# ---- LOGGING ----
logging.level.com.deepwork.ai=DEBUG
logging.level.org.springframework.web=DEBUG

# ---- ACTUATOR ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
