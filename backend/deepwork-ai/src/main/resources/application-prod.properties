# Production Environment Configuration
spring.application.name=deepwork-ai
server.port=${PORT:8081}

# ---- DATABASE ----
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- FILE UPLOAD ----
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- TIMEOUTS ----
server.tomcat.connection-timeout=600000
spring.mvc.async.request-timeout=600000

# ---- CORS ----
cors.allowed-origins=${ALLOWED_ORIGINS:https://deepwork-ai-one.vercel.app}

# ---- AI SERVICE ----
ai.service.url=${AI_SERVICE_URL:https://ameera09-ai-service.hf.space/analyze}

# ---- LOGGING ----
logging.level.com.deepwork.ai=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.autoconfigure=WARN